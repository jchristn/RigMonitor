global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # RigMonitor's Radiant scrape endpoint: RigMonitor application metrics, Watson HTTP metrics,
  # and .NET runtime/process metrics.
  - job_name: 'rigmonitor'
    metrics_path: '/metrics'
    # Classic text format: Prometheus 3 otherwise negotiates OpenMetrics and rejects the OpenTelemetry
    # exporter's UNIT metadata for some instruments (for example watson.server.received.bytes).
    scrape_protocols: ['PrometheusText0.0.4']
    static_configs:
      - targets: ['rigmonitor:9464']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['127.0.0.1:9090']
