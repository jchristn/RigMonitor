services:
  rigmonitor:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: rigmonitor
    ports:
      - "9990:9990"
    volumes:
      # Persist the entire runtime data directory. SQLite WAL mode writes the
      # main database, -wal, and -shm files side-by-side; do not mount only the
      # .db file or telemetry history can be lost/corrupted across restarts.
      - type: bind
        source: ./data
        target: /app/data
    restart: unless-stopped
